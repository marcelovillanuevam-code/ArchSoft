<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OLP300{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
    {% if session.get('usuario') %}
    <nav class="fixed left-0 top-0 z-50 w-full bg-[#B8960C] text-white shadow-sm">
        <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6">
            <a href="/catalogo" class="text-lg font-semibold tracking-wide">Biblioteca UDEM</a>
            <div class="flex items-center gap-5 text-sm">
                <span>Bienvenido, {{ session.get("nombre", "") }}</span>
                <a href="/logout" class="rounded border border-white/70 px-3 py-1.5 font-medium transition hover:bg-white hover:text-[#B8960C]">
                    Cerrar sesion
                </a>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="{% if session.get('usuario') %}pt-16{% endif %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
