services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: ${DB_NAME:-olp300}
      MYSQL_USER: ${DB_USER:-olp300_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-olp300_pass_dev}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Sobreescribe DB_HOST del .env para apuntar al contenedor de MariaDB
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
